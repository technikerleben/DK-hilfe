name: APK bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'release/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daenemark-hilfe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: APK im Repository bereitstellen
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Daenemark-Hilfe.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Daenemark-Hilfe.apk
          git commit -m "APK aktualisieren"
          git push
